name: CI
on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run skill:check
      - run: npm run test:acceptance
      - run: npx playwright install --with-deps chromium
      - run: npm run test:acceptance:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-browser
          path: .context/acceptance.png
